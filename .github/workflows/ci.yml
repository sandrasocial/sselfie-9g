name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (revenue-critical paths)
        run: pnpm tsc --noEmit --project tsconfig.ci.json

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --run
