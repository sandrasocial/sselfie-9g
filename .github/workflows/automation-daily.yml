# Daily automation: run audits + digests + triage + archive, then commit evidence to the repo.
# Runs at 06:00 UTC every day. No action needed from you — evidence appears in output/automation/.
#
# Required: Add DATABASE_URL to this repo's GitHub Secrets (Settings → Secrets and variables → Actions).
name: Automation daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily automation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm automation:daily
        continue-on-error: true

      - name: Commit and push evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/automation/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(automation): daily evidence update [skip ci]"
            git push
          fi
